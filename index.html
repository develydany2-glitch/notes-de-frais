<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notes de frais</title>
  <meta name="description" content="Saisie des notes de frais avec photo du ticket, suivi des remboursements par mois.">
  <meta name="theme-color" content="#14233A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Frais">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="sidenav" aria-label="Navigation principale">
      <div class="brand"><img src="icons/icon-192.png" alt=""><span>Notes de frais</span></div>
      <a href="#/accueil" data-tab="accueil">Accueil</a>
      <a href="#/tableau" data-tab="tableau">Tableau mensuel</a>
      <a href="#/planning" data-tab="planning">Oublis &amp; rappels</a>
      <a href="#/reglages" data-tab="reglages">Réglages</a>
      <button class="btn btn-primary side-add" data-action="add">Nouvelle note</button>
      <div class="side-sync" id="side-sync"></div>
    </nav>

    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Navigation">
    <a href="#/accueil" data-tab="accueil"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></a>
    <a href="#/tableau" data-tab="tableau"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 10h16M10 10v9"/></svg><span>Tableau</span></a>
    <button class="tab-add" data-action="add" aria-label="Nouvelle note de frais"><svg viewBox="0 0 24 24"><path d="M9 4.5 7.6 6.5H5a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-2.6L15 4.5z"/><circle cx="12" cy="13" r="3.6"/></svg></button>
    <a href="#/planning" data-tab="planning"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span>Oublis</span><i class="dot" id="planning-dot" hidden></i></a>
    <a href="#/reglages" data-tab="reglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Réglages</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="sheet" class="sheet"></dialog>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="gal" accept="image/*" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notes de frais</title>
  <meta name="description" content="Saisie des notes de frais avec photo du ticket, suivi des remboursements par mois.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Frais">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="sidenav" aria-label="Navigation principale">
      <div class="brand"><img src="icon-192.png" alt=""><span>Notes de frais</span></div>
      <a href="#/deplacements" data-tab="deplacements">Déplacements</a>
      <a href="#/mois" data-tab="mois">Mois</a>
      <a href="#/reglages" data-tab="reglages">Réglages</a>
      <button class="btn btn-primary side-add" data-action="add">Nouvelle note</button>
      <div class="side-sync" id="side-sync"></div>
    </nav>

    <main id="view" tabindex="-1"></main>
  </div>

  <div class="navbar" id="navbar" aria-hidden="true"><span id="nav-title"></span></div>

  <nav class="tabbar" aria-label="Navigation">
    <a href="#/deplacements" data-tab="deplacements"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.2A2.2 2.2 0 0 1 10.7 3h2.6a2.2 2.2 0 0 1 2.2 2.2V7M3 13h18"/></svg><span>Déplacements</span><i class="dot" id="trip-dot" hidden></i></a>
    <button class="tab-add" data-action="add" aria-label="Nouvelle note de frais"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7.5v9M7.5 12h9"/></svg><span>Ajouter</span></button>
    <a href="#/mois" data-tab="mois"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Mois</span><i class="dot" id="month-dot" hidden></i></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="sheet" class="sheet"></dialog>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="gal" accept="image/*" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
